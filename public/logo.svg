      @keyframes popIn {
        to { transform: scale(1); }
      }
    </style> -->
  </defs>

  <!-- Punto inicial en el centro -->
  <circle class="center-dot" cx="50" cy="50" r="7" fill="url(#puntoXGrad)" />

  <!-- Brazos difuminados (diagonal superior-izquierda) -->
  <path class="arm" d="M50 50 L25 25"
    stroke="url(#puntoXGrad)" stroke-width="14"
    stroke-linecap="round" stroke-dasharray="36" opacity="0.4" />
  <path class="arm" d="M50 50 L75 75"
    stroke="url(#puntoXGrad)" stroke-width="14"
    stroke-linecap="round" stroke-dasharray="36" opacity="0.4" />

  <!-- Brazos sólidos (diagonal inferior-izquierda a superior-derecha) -->
  <path class="arm" d="M50 50 L25 75"
    stroke="url(#puntoXGrad)" stroke-width="14"
    stroke-linecap="round" stroke-dasharray="36" />
  <path class="arm" d="M50 50 L75 25"
    stroke="url(#puntoXGrad)" stroke-width="14"
    stroke-linecap="round" stroke-dasharray="36" />

  <!-- Punto acento superior-derecho -->
  <circle class="accent-dot" cx="75" cy="25" r="10" fill="#2dd4bf" />
</svg>