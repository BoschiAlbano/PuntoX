<svg
  viewBox="0 0 100 100"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient
      id="puntoXGrad"
      x1="20"
      y1="80"
      x2="80"
      y2="20"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- <style>
      /* Punto central: aparece, se mantiene, desaparece */
      .center-dot {
        transform-origin: 50px 50px;
        animation: centerDot 1.5s ease forwards;
      }
      @keyframes centerDot {
        0%   { transform: scale(0); }
        13%  { transform: scale(1); }
        35%  { transform: scale(1); }
        52%  { transform: scale(0); }
        100% { transform: scale(0); }
      }

      /* Brazos: se dibujan desde el centro hacia afuera */
